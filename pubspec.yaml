name: foodsnap_ai
description: "FoodSnap AI - Cross-platform calorie & protein tracking app for Mobile and Desktop"
publish_to: "none"
version: 1.0.1+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.3
  purchases_flutter: ^10.12.0
  google_mobile_ads: ^9.1.0
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.13.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    # Nur tatsächlich geladene Modelle einzeln listen (kein Ordner-Wildcard,
    # sonst landen Duplikate/README im Bundle). Kein .env mehr!
    - assets/models/food_classifier_quant.tflite
    - assets/models/food_labels.txt
    - assets/models/nutrition_db.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

