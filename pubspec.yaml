name: foodsnap_ai
description: "FoodSnap AI - Cross-platform calorie & protein tracking app for Mobile and Desktop"
publish_to: "none"
version: 1.0.2+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.3
  purchases_flutter: ^10.12.0
  google_mobile_ads: ^9.1.0
  http: ^1.2.2
  url_launcher: ^6.3.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # assets/icon/ wird NICHT gebündelt: die Bilder nutzt nur flutter_launcher_icons
  # beim Generieren der App-Icons (image_path unten), die App selbst lädt sie nie.
  # Kein .env als Asset! Keys nur per dart-define (siehe lib/core/config/api_keys.dart).

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

